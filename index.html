<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบผู้จัดการ - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Style for bottom nav active state */
        .nav-btn { color: #9ca3af; transition: color 0.2s; }
        .nav-btn.active { color: #2563eb; }
        .nav-btn.active svg { stroke-width: 2.5; }
        
        /* Floating Action Button (FAB) */
        .fab { position: fixed; bottom: 80px; right: 20px; z-index: 40; }
    </style>
</head>
<body class="h-screen w-full flex justify-center bg-gray-100 overflow-hidden">

    <!-- Message Box -->
    <div id="message-box" class="hidden fixed top-4 right-4 left-4 max-w-md mx-auto bg-white shadow-2xl border-l-4 p-4 rounded-2xl z-[60] transition-all duration-300">
        <p id="message-text" class="text-gray-800 font-medium"></p>
    </div>

    <!-- Store Holiday Modal (Bottom Sheet Style) -->
    <div id="holiday-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end justify-center z-50">
        <div class="bg-white p-6 rounded-t-3xl shadow-2xl w-full max-w-md fade-in pb-safe">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
            <h3 class="text-xl font-bold mb-4 text-gray-800">วันหยุดประจำปีร้าน</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">วันที่หยุด <span class="text-rose-500">*</span></label>
                    <input type="date" id="holiday-date" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ชื่อเทศกาล <span class="text-rose-500">*</span></label>
                    <input type="text" id="holiday-name" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" placeholder="เช่น วันสงกรานต์">
                </div>
            </div>
            <div class="flex space-x-3 mt-6">
                <button onclick="closeModal('holiday-modal')" class="flex-1 py-3.5 bg-gray-100 text-gray-800 rounded-xl font-bold active:scale-95 transition">ยกเลิก</button>
                <button onclick="saveStoreHoliday()" class="flex-1 py-3.5 bg-amber-500 text-white rounded-xl font-bold shadow-md active:scale-95 transition">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Employee Modal (Bottom Sheet Style) -->
    <div id="emp-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end justify-center z-50">
        <div class="bg-white p-6 rounded-t-3xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto fade-in pb-safe hide-scrollbar">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
            <h3 id="emp-modal-title" class="text-xl font-bold mb-4 text-gray-800">เพิ่มพนักงาน</h3>
            <input type="hidden" id="emp-id">
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 ml-1 mb-1">ชื่อ <span class="text-rose-500">*</span></label>
                    <input type="text" id="emp-name" class="w-full bg-gray-50 border border-gray-100 p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 ml-1 mb-1">ตำแหน่ง</label>
                    <input type="text" id="emp-position" class="w-full bg-gray-50 border border-gray-100 p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <label class="block text-xs font-bold text-blue-800 ml-1 mb-1">รหัส PIN 4 หลัก <span class="text-rose-500">*</span></label>
                    <input type="password" id="emp-pin" maxlength="4" inputmode="numeric" class="w-full bg-white border border-blue-200 p-3 rounded-xl outline-none tracking-[1em] text-center text-xl font-bold focus:ring-2 focus:ring-blue-500" placeholder="****">
                </div>

                <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                    <p class="font-bold text-emerald-800 text-xs mb-2">เงินเดือน & OT</p>
                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <div>
                            <label class="block text-[10px] font-bold text-emerald-700 mb-1">ค่าแรง (บาท/วัน)</label>
                            <input type="number" id="emp-wage" class="w-full bg-white border border-emerald-200 p-2.5 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-emerald-500" inputmode="numeric">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-emerald-700 mb-1">ค่า OT (บาท/ชม.)</label>
                            <input type="number" id="emp-ot-rate" class="w-full bg-white border border-emerald-200 p-2.5 rounded-xl outline-none font-bold text-sm focus:ring-2 focus:ring-emerald-500" inputmode="numeric">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-emerald-700 mb-1">วันหยุดสัปดาห์</label>
                        <select id="emp-dayoff" class="w-full bg-white border border-emerald-200 p-2.5 rounded-xl outline-none text-sm focus:ring-2 focus:ring-emerald-500">
                            <option value="">ไม่มีวันหยุด</option>
                            <option value="0">อาทิตย์</option><option value="1">จันทร์</option><option value="2">อังคาร</option>
                            <option value="3">พุธ</option><option value="4">พฤหัส</option><option value="5">ศุกร์</option><option value="6">เสาร์</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex space-x-3 mt-6">
                <button onclick="closeModal('emp-modal')" class="flex-1 py-3.5 bg-gray-100 text-gray-800 rounded-xl font-bold active:scale-95 transition">ยกเลิก</button>
                <button onclick="saveEmployee()" class="flex-1 py-3.5 bg-blue-600 text-white rounded-xl font-bold shadow-md active:scale-95 transition">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Edit Time Modal -->
    <div id="edit-time-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end justify-center z-50">
        <div class="bg-white p-6 rounded-t-3xl shadow-2xl w-full max-w-sm fade-in pb-safe">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
            <h3 class="text-lg font-bold mb-1 text-gray-900">แก้ไขเวลา</h3>
            <p id="edit-time-name" class="font-bold text-blue-600 mb-4 text-sm"></p>
            <input type="hidden" id="edit-time-id">
            
            <div class="space-y-3 mb-6">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ประเภท</label>
                    <select id="edit-time-type" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none font-bold">
                        <option value="เข้างาน">เข้างาน</option><option value="ออกงาน">ออกงาน</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">วันที่และเวลา</label>
                    <input type="datetime-local" id="edit-time-datetime" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl outline-none">
                </div>
            </div>

            <div class="flex space-x-3">
                <button onclick="closeModal('edit-time-modal')" class="flex-1 py-3.5 bg-gray-100 text-gray-800 rounded-xl font-bold active:scale-95 transition">ยกเลิก</button>
                <button onclick="saveTimeRecord()" class="flex-1 py-3.5 bg-blue-600 text-white rounded-xl font-bold shadow-md active:scale-95 transition">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm text-center fade-in">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-rose-100 mb-4">
                <svg class="h-8 w-8 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </div>
            <h3 class="text-xl font-bold mb-2 text-gray-900">ยืนยันการลบ</h3>
            <p id="delete-message" class="text-sm text-gray-500 mb-6"></p>
            <input type="hidden" id="delete-id">
            <input type="hidden" id="delete-collection">
            <div class="flex space-x-3">
                <button onclick="closeModal('delete-modal')" class="flex-1 py-3.5 bg-gray-100 text-gray-800 rounded-xl font-bold active:scale-95 transition">ยกเลิก</button>
                <button onclick="executeDelete()" class="flex-1 py-3.5 bg-rose-600 text-white rounded-xl font-bold shadow-md active:scale-95 transition">ลบทิ้ง</button>
            </div>
        </div>
    </div>

    <!-- Main View -->
    <div class="w-full max-w-md h-full bg-gray-50 flex flex-col relative overflow-hidden shadow-2xl">
        
        <!-- Header (Sticky) -->
        <div class="bg-blue-600 px-5 py-4 text-white flex justify-between items-center shadow-sm z-10">
            <div>
                <h1 class="text-xl font-bold">หลังบ้าน</h1>
                <p id="status" class="text-[10px] text-blue-200">กำลังเชื่อมต่อ...</p>
            </div>
            <div class="bg-blue-700/50 px-3 py-1.5 rounded-full text-xs font-medium backdrop-blur-sm">
                <span id="current-date"></span>
            </div>
        </div>

        <!-- Content Area (Scrollable with bottom padding) -->
        <div class="flex-1 overflow-y-auto pb-24 px-4 pt-4 hide-scrollbar">
            
            <!-- Tab 1: Records -->
            <div id="content-records" class="block fade-in">
                <!-- Live Store Status (New Feature) -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4">
                    <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center">
                        <svg class="w-4 h-4 mr-1 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        สถานะที่ร้านวันนี้
                    </h3>
                    <div id="live-status-list" class="flex flex-wrap gap-2">
                        <span class="text-xs text-gray-400">กำลังโหลด...</span>
                    </div>
                </div>

                <h3 class="text-sm font-bold text-gray-500 mb-2 ml-1">ประวัติล่าสุด</h3>
                <div id="records-body" class="space-y-3">
                    <!-- Cards will be generated here -->
                </div>
            </div>

            <!-- Tab 2: Requests -->
            <div id="content-requests" class="hidden fade-in space-y-3">
                <div id="requests-body">
                    <!-- Cards will be generated here -->
                </div>
            </div>

            <!-- Tab 3: Employees -->
            <div id="content-employees" class="hidden fade-in">
                
                <!-- Store Holiday Settings -->
                <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100 shadow-sm mb-5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-amber-800 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            วันหยุดร้าน (4 วัน/ปี)
                        </h3>
                        <button onclick="document.getElementById('holiday-modal').classList.remove('hidden')" class="bg-amber-500 text-white py-1.5 px-3 rounded-lg text-xs font-bold active:scale-95 transition">+ เพิ่ม</button>
                    </div>
                    <div id="holidays-body" class="space-y-2"></div>
                </div>

                <div class="flex justify-between items-center mb-2 ml-1">
                    <h3 class="text-sm font-bold text-gray-500">รายชื่อพนักงาน</h3>
                </div>
                <div id="employees-body" class="space-y-3">
                    <!-- Cards will be generated here -->
                </div>
                
                <!-- FAB for Adding Employee -->
                <button onclick="openEmpModal()" class="fab bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center active:scale-95 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>

            <!-- Tab 4: Payroll -->
            <div id="content-payroll" class="hidden fade-in">
                <!-- Filter Card (Sticky on top) -->
                <div class="bg-emerald-600 p-4 rounded-3xl shadow-lg mb-4 text-white">
                    <div class="flex items-center mb-3">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                        <h2 class="text-sm font-bold">รอบบิลเงินเดือน</h2>
                    </div>
                    <div class="flex space-x-2">
                        <div class="flex-1">
                            <label class="block text-[10px] text-emerald-100 mb-1">เริ่ม</label>
                            <input type="date" id="pay-start" onchange="calculatePayroll()" class="w-full bg-white/20 border border-emerald-400/30 text-white p-2.5 rounded-xl text-sm outline-none focus:bg-white focus:text-gray-800 transition">
                        </div>
                        <div class="flex-1">
                            <label class="block text-[10px] text-emerald-100 mb-1">ถึง</label>
                            <input type="date" id="pay-end" onchange="calculatePayroll()" class="w-full bg-white/20 border border-emerald-400/30 text-white p-2.5 rounded-xl text-sm outline-none focus:bg-white focus:text-gray-800 transition">
                        </div>
                    </div>
                </div>

                <div id="payroll-body" class="space-y-3">
                    <!-- Cards will be generated here -->
                </div>
            </div>

        </div>

        <!-- 🌟 Bottom Navigation Bar -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around items-center pb-safe pt-2 pb-3 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-30">
            <button onclick="switchTab('records')" id="nav-records" class="nav-btn active flex flex-col items-center w-1/4 py-1">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px] font-bold">ประวัติ</span>
            </button>
            <button onclick="switchTab('requests')" id="nav-requests" class="nav-btn relative flex flex-col items-center w-1/4 py-1">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="text-[10px] font-bold">คำร้อง</span>
                <span id="badge-requests" class="hidden absolute top-0 right-3 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white">0</span>
            </button>
            <button onclick="switchTab('employees')" id="nav-employees" class="nav-btn flex flex-col items-center w-1/4 py-1">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-[10px] font-bold">พนักงาน</span>
            </button>
            <button onclick="switchTab('payroll')" id="nav-payroll" class="nav-btn flex flex-col items-center w-1/4 py-1 text-emerald-600">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px] font-bold">เงินเดือน</span>
            </button>
        </nav>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, query, where, getDocs, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHuZGyY1F3v4rCrhrpt9YB90C0Ahh-stE",
            authDomain: "my-company-time-tracking.firebaseapp.com",
            projectId: "my-company-time-tracking",
            storageBucket: "my-company-time-tracking.firebasestorage.app",
            messagingSenderId: "758524847747",
            appId: "1:758524847747:web:2e5a49e4064334f1265db6",
            measurementId: "G-50SYJKTRT1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const isCanvas = typeof __app_id !== 'undefined';
        const canvasAppId = isCanvas ? __app_id : 'default-id';
        const getPath = (colName) => isCanvas ? `artifacts/${canvasAppId}/public/data/${colName}` : colName;

        let currentUser = null;
        let employeesDataGlobal = []; 
        let allTimeRecordsGlobal = []; 
        let allRequestsGlobal = [];
        let storeHolidaysGlobal = [];
        
        const dayNames = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

        // Init Payroll Dates
        const today = new Date();
        const currentDay = today.getDay() || 7; 
        const monday = new Date(today);
        monday.setDate(today.getDate() - currentDay + 1);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        document.getElementById('pay-start').value = monday.toLocaleDateString('en-CA');
        document.getElementById('pay-end').value = sunday.toLocaleDateString('en-CA');

        const optionsDate = { day: 'numeric', month: 'short', year: '2-digit' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('th-TH', optionsDate);

        window.showMessage = function(msg, isError = false) {
            const box = document.getElementById('message-box');
            const text = document.getElementById('message-text');
            text.textContent = msg;
            box.className = `fixed top-4 right-4 left-4 max-w-md mx-auto shadow-2xl border-l-4 p-4 rounded-2xl z-[60] transition-all duration-300 ${isError ? 'bg-rose-50 border-rose-500 text-rose-800' : 'bg-emerald-50 border-emerald-500 text-emerald-800'}`;
            box.classList.remove('hidden');
            setTimeout(() => { box.classList.add('hidden'); }, 3000);
        };

        window.switchTab = function(tabName) {
            ['records', 'requests', 'employees', 'payroll'].forEach(name => {
                document.getElementById(`content-${name}`).classList.add('hidden');
                document.getElementById(`nav-${name}`).classList.remove('active');
            });
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.add('active');
            
            if(tabName === 'payroll') calculatePayroll(); 
        };

        window.closeModal = function(modalId) { document.getElementById(modalId).classList.add('hidden'); };

        window.openEmpModal = function(id = '', name = '', position = '', pin = '', wage = '', dayoff = '', otRate = '') {
            document.getElementById('emp-id').value = id;
            document.getElementById('emp-name').value = name;
            document.getElementById('emp-position').value = position;
            document.getElementById('emp-pin').value = pin; 
            document.getElementById('emp-wage').value = wage; 
            document.getElementById('emp-dayoff').value = dayoff; 
            document.getElementById('emp-ot-rate').value = otRate; 
            document.getElementById('emp-modal-title').textContent = id ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มพนักงาน';
            document.getElementById('emp-modal').classList.remove('hidden');
        };

        window.openDeleteModal = function(id, collection, displayMsg, empName = null) {
            document.getElementById('delete-id').value = id;
            document.getElementById('delete-collection').value = collection;
            document.getElementById('delete-modal').setAttribute('data-empname', empName || '');
            document.getElementById('delete-message').innerHTML = `ลบ <b>"${displayMsg}"</b> ถาวรใช่หรือไม่?<br><span class="text-rose-500 text-xs mt-1 block">(ข้อมูลประวัติของคนนี้จะถูกลบไปด้วย)</span>`;

        };

        const formatDateParts = (timestamp) => {
            if (!timestamp) return { date: '..', time: '..' };
            const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return {
                date: d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' }),
                time: d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            };
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { await signInAnonymously(auth); }
            } catch (error) { console.error("Auth err"); }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('status').textContent = "🟢 ออนไลน์";
                document.getElementById('status').className = "text-[10px] text-emerald-200 font-bold";
                loadAllData();
            }
        });

        initAuth();

            // 1. Records

                            <button onclick="openDeleteModal('${record.id}', 'time_records', 'เวลาของ ${record.name}')" class="p-1.5 text-gray-400 hover:text-rose-500 bg-gray-50 rounded-lg active:scale-95"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>

            // 2. Requests

                    if (req.status === 'ไม่อนุมัติ') statusColor = 'bg-rose-100 text-rose-800';

                                <span class="text-[10px] text-gray-500">${formatDateParts(req.timestamp).date} • <span class="text-blue-600 font-bold">${req.type}</span></span>

                            <span class="text-[10px] font-bold px-2 py-1 rounded-lg ${statusColor}">${req.status}</span>

                                <button onclick="updateRequestStatus('${req.id}', 'ไม่อนุมัติ')" class="flex-1 bg-rose-100 text-rose-700 py-2 rounded-xl text-xs font-bold active:scale-95 transition">ไม่อนุมัติ</button>

                const badge = document.getElementById('badge-requests');
                if (pendingCount > 0) { badge.textContent = pendingCount; badge.classList.remove('hidden'); } 
                else { badge.classList.add('hidden'); }
                renderEmployeeTable();
            }, console.error);

            // 3. Employees
            onSnapshot(collection(db, getPath('employees')), (snapshot) => {
                employeesDataGlobal = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                employeesDataGlobal.sort((a, b) => a.name.localeCompare(b.name, 'th'));
                renderEmployeeTable();

        // Live Store Status function
        function updateLiveStoreStatus() {
            const container = document.getElementById('live-status-list');
            const todayStr = new Date().toLocaleDateString('th-TH');
            
            // หาคนที่ล่าสุดกด 'เข้างาน' ภายในวันนี้
            const atStore = [];
            employeesDataGlobal.forEach(emp => {
                const myToday = allTimeRecordsGlobal.filter(r => {

                    const d = r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                    return d.toLocaleDateString('th-TH') === todayStr;
                });
                if(myToday.length > 0 && myToday[0].type === 'เข้างาน') {
                    const d = myToday[0].timestamp.toDate ? myToday[0].timestamp.toDate() : new Date(myToday[0].timestamp);

        // --- ระบบคำนวณเงินเดือน & OT (PAYROLL) ---
        window.calculatePayroll = function() {
            const startStr = document.getElementById('pay-start').value;
            const endStr = document.getElementById('pay-end').value;
            if(!startStr || !endStr) return;

            const startDate = new Date(startStr); startDate.setHours(0,0,0,0);
            const endDate = new Date(endStr); endDate.setHours(23,59,59,999);
            const container = document.getElementById('payroll-body');
            
            if(employeesDataGlobal.length === 0) return container.innerHTML = '<div class="text-center text-gray-400 py-10 text-sm">ไม่มีข้อมูลพนักงาน</div>';

            const html = employeesDataGlobal.map(emp => {
                const empRecords = allTimeRecordsGlobal.filter(r => r.name === emp.name);
                const dailyRecords = {};
                
                empRecords.forEach(r => {
                    if(!r.timestamp) return;
                    const d = r.timestamp.toDate ? r.timestamp.toDate() : new Date(r.timestamp);
                    if(d >= startDate && d <= endDate) {
                        const dateStr = d.toLocaleDateString('en-CA');
                        if(!dailyRecords[dateStr]) dailyRecords[dateStr] = { in: null, out: null };
                        
                        if(r.type === 'เข้างาน') {
                            if(!dailyRecords[dateStr].in || d < dailyRecords[dateStr].in) dailyRecords[dateStr].in = d;
                        } else if(r.type === 'ออกงาน') {
                            if(!dailyRecords[dateStr].out || d > dailyRecords[dateStr].out) dailyRecords[dateStr].out = d;
                        }
                    }
                });

                const workedDaysCount = Object.keys(dailyRecords).filter(k => dailyRecords[k].in !== null).length;
                let paidDayOffs = 0;
                const regOff = parseInt(emp.dayOff);
                
                for(let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    const dStr = d.toLocaleDateString('en-CA');
                    const isWeeklyOff = (!isNaN(regOff) && d.getDay() === regOff);
                    const isStoreHoliday = storeHolidaysGlobal.some(h => h.date === dStr);
                    
                    if((isWeeklyOff || isStoreHoliday) && (!dailyRecords[dStr] || !dailyRecords[dStr].in)) {
                        paidDayOffs++;
                    }
                }

                let totalOTHours = 0;
                Object.values(dailyRecords).forEach(day => {
                    if(day.out) {
                        const outTime = day.out;
                        const otLimitTime = new Date(outTime);
                        otLimitTime.setHours(18, 0, 0, 0); 
                        if(outTime > otLimitTime) {
                            const diffHrs = (outTime - otLimitTime) / (1000 * 60 * 60);
                            totalOTHours += Math.round(diffHrs * 100) / 100; 
                        }
                    }
                });

                const wage = parseFloat(emp.wage) || 0;
                const otRate = parseFloat(emp.otRate) || 0;
                const totalBaseDays = workedDaysCount + paidDayOffs;
                const grandTotal = (totalBaseDays * wage) + (totalOTHours * otRate);

                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col relative overflow-hidden">
                        <div class="absolute right-0 top-0 bg-emerald-500 text-white font-black text-sm px-3 py-1.5 rounded-bl-xl shadow-sm">
                            ฿${grandTotal.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0})}
                        </div>
                        <h3 class="font-bold text-gray-800 text-sm mb-3">${emp.name}</h3>
                        
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-gray-500">วันทำงาน (มาจริง+พักได้เงิน)</span>
                            <span class="text-xs font-bold text-blue-600">${workedDaysCount} + ${paidDayOffs} = ${totalBaseDays} วัน</span>
                        </div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs text-gray-500">ล่วงเวลา (OT)</span>
                            <span class="text-xs font-bold text-amber-600">${totalOTHours.toFixed(1)} ชม.</span>
                        </div>
                        
                        <div class="bg-gray-50 rounded-xl p-2.5 flex justify-between items-center mt-2 border border-gray-100">
                            <div class="text-[10px] text-gray-500">เรท: ฿${wage}/วัน | OT: ฿${otRate}/ชม.</div>
                            <button onclick="copyPayslip('${emp.name}', '${startStr}', '${endStr}', ${workedDaysCount}, ${paidDayOffs}, ${totalBaseDays}, ${wage}, ${totalOTHours}, ${otRate}, ${grandTotal})" class="bg-white border border-gray-200 text-gray-700 px-3 py-1 rounded-lg text-xs font-bold active:scale-95 transition shadow-sm flex items-center">
                                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                คัดลอกสลิป
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        };

        // 1-Click Payslip Share
        window.copyPayslip = function(name, start, end, work, off, totalDays, wage, otHrs, otRate, total) {
            const d1 = new Date(start).toLocaleDateString('th-TH', { day:'numeric', month:'short' });
            const d2 = new Date(end).toLocaleDateString('th-TH', { day:'numeric', month:'short' });
            
            const txt = `[สรุปเงินเดือน] ${name}
รอบ: ${d1} - ${d2}
-------------------
✔️ วันทำงานรวม: ${totalDays} วัน
(มาจริง ${work} + วันหยุดนักขัตฯ/สัปดาห์ ${off})
💵 ค่าแรงรวม: ฿${(totalDays*wage).toLocaleString()}
-------------------
⏱️ ล่วงเวลา (OT): ${otHrs} ชม.
💵 เงิน OT รวม: ฿${(otHrs*otRate).toLocaleString()}
-------------------
💰 ยอดโอนสุทธิ: ฿${total.toLocaleString()}`;

            const textArea = document.createElement("textarea");
            textArea.value = txt;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            showMessage("คัดลอกสลิปเงินเดือนแล้ว! (นำไปวางในแชท LINE ได้เลย)");
        }

        // --- Save Store Holiday ---
        window.saveStoreHoliday = async function() {
            const date = document.getElementById('holiday-date').value;
            const name = document.getElementById('holiday-name').value.trim();

            if (!date || !name) return showMessage("กรุณากรอกข้อมูลให้ครบถ้วน", true);
            
            const year = date.substring(0, 4);
            const holidaysThisYear = storeHolidaysGlobal.filter(h => h.date.startsWith(year)).length;
            if(holidaysThisYear >= 4) return showMessage(`ปีนี้ตั้งหยุดครบ 4 วันแล้ว`, true);

            try {
                await addDoc(collection(db, getPath('store_holidays')), { date, name });
                showMessage("เพิ่มวันหยุดร้านสำเร็จ");
                closeModal('holiday-modal');
                document.getElementById('holiday-date').value = '';
                document.getElementById('holiday-name').value = '';
            } catch (error) { showMessage("เกิดข้อผิดพลาด", true); }
        };

        window.saveEmployee = async function() {
            const id = document.getElementById('emp-id').value;
            const name = document.getElementById('emp-name').value.trim();
            const position = document.getElementById('emp-position').value.trim();
            let pin = document.getElementById('emp-pin').value.trim();
            let wage = document.getElementById('emp-wage').value.trim();
            let dayOff = document.getElementById('emp-dayoff').value;
            let otRate = document.getElementById('emp-ot-rate').value.trim();

            if (!name || !pin || pin.length < 4) return showMessage("กรุณากรอกชื่อและรหัส PIN 4 หลัก", true);

            const duplicatePin = employeesDataGlobal.find(e => e.pin === pin && e.id !== id);
            if (duplicatePin) return showMessage(`PIN ซ้ำกับ "${duplicatePin.name}"`, true);

            try {
                const data = { name, position, pin, wage, dayOff, otRate };
                if (id) await updateDoc(doc(db, getPath('employees'), id), data);
                else await addDoc(collection(db, getPath('employees')), data);
                showMessage("บันทึกสำเร็จ");
                closeModal('emp-modal');
            } catch (error) { showMessage("บันทึกข้อมูลล้มเหลว", true); }
        };

        window.executeDelete = async function() {
            const id = document.getElementById('delete-id').value;
            const collectionName = document.getElementById('delete-collection').value;
            const empName = document.getElementById('delete-modal').getAttribute('data-empname');
            
            try {
                await deleteDoc(doc(db, getPath(collectionName), id));
                if (collectionName === 'employees' && empName) {
                    const batch = writeBatch(db);
                    const timeQ = query(collection(db, getPath('time_records')), where("name", "==", empName));
                    const timeDocs = await getDocs(timeQ);
                    timeDocs.forEach(d => batch.delete(d.ref));
                    
                    const reqQ = query(collection(db, getPath('requests')), where("name", "==", empName));
                    const reqDocs = await getDocs(reqQ);
                    reqDocs.forEach(d => batch.delete(d.ref));
                    await batch.commit(); 
                }
                showMessage("ลบข้อมูลสำเร็จแล้ว");
                closeModal('delete-modal');
            } catch (error) { showMessage("ลบข้อมูลล้มเหลว", true); }
        };

        window.openEditTimeModal = function(id, name, type, datetime) {
            document.getElementById('edit-time-id').value = id;
            document.getElementById('edit-time-name').textContent = `พนักงาน: ${name}`;
            document.getElementById('edit-time-type').value = type;
            document.getElementById('edit-time-datetime').value = datetime;
            document.getElementById('edit-time-modal').classList.remove('hidden');
        };

        window.saveTimeRecord = async function() {
            const id = document.getElementById('edit-time-id').value;
            const type = document.getElementById('edit-time-type').value;
            const dtString = document.getElementById('edit-time-datetime').value;

            if(!dtString) return showMessage("กรุณาระบุวันที่และเวลา", true);

            try {
                const dateObj = new Date(dtString);
                const newTimestamp = Timestamp.fromDate(dateObj);
                await updateDoc(doc(db, getPath('time_records'), id), { type, timestamp: newTimestamp });
                showMessage("แก้ไขสำเร็จ!");
                closeModal('edit-time-modal');
            } catch(e) { showMessage("เกิดข้อผิดพลาด", true); }
        };

        window.updateRequestStatus = async function(docId, newStatus) {
            try {
                await updateDoc(doc(db, getPath('requests'), docId), { status: newStatus });
                showMessage(`เปลี่ยนสถานะเป็น ${newStatus} แล้ว`);
            } catch (error) { showMessage("เกิดข้อผิดพลาด", true); }
        };

    </script>
</body>
</html>
